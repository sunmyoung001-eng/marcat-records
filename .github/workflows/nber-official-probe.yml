name: marCat NBER Announcements Research-Only Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nber-official-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-official-committee-announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest private research parser
        uses: actions/checkout@v4
        with:
          repository: sunmyoung001-eng/marcat
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client only
        run: python -m pip install requests
      - name: NBER direct official read-only URL, no public data artifacts
        env:
          PYTHONPATH: engine
        run: |
          python engine/scripts/probe_nber_announcements.py --output "$RUNNER_TEMP/nber-research-only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"nber-research-only.json"
          data=json.loads(path.read_text())
          assert data["classification"]=="private_retrospective_announcement_dates_only"
          assert data["event_count"]>=8
          assert data["forecasts_issued"] is False
          assert data["public_records_changed"] is False
          assert all(e["first_publication_vintage_verified"] is False for e in data["events"])
          print("NBER_RESEARCH_ONLY_READBACK_VERIFIED")
          PY
      - name: Store immutable NBER metadata in private marCat source archive
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --kind nber-announcements --input "$RUNNER_TEMP/nber-research-only.json"
      - name: Remove private temporary research metadata
        if: always()
        run: rm -f "$RUNNER_TEMP/nber-research-only.json"
