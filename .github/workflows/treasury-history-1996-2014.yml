name: marCat Treasury Historical Auction Research 1996-2014
on:
  push:
    branches: [main]
    paths: ['.github/workflows/treasury-history-1996-2014.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marcat-treasury-historical-1996-2014
  cancel-in-progress: false
jobs:
  archive-independent-year-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private source-probe code
        uses: actions/checkout@v4
        with:
          repository: sunmyoung001-eng/marcat
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official API client
        run: python -m pip install requests
      - name: Collect 1996-2014 official FiscalData and preserve separate private year receipts
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
          PYTHONPATH: engine
        run: |
          set -uo pipefail
          failed_years=""
          successful_years=0
          for year in 1996 1997 1998 1999 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014; do
            echo "Treasury research year=${year}"
            export YEAR="${year}"
            target="$RUNNER_TEMP/treasury-${year}-private.json"
            if ! python engine/scripts/probe_treasury_auctions.py --year "${year}" --output "${target}"; then
              echo "::warning::TREASURY_YEAR_PROBE_FAILED ${year}"
              failed_years="${failed_years} ${year}"
              rm -f "${target}"
              continue
            fi
            python - <<'PY'
          import json,os
          from pathlib import Path
          year=int(os.environ['YEAR'])
          p=Path(os.environ['RUNNER_TEMP'])/f'treasury-{year}-private.json'
          x=json.loads(p.read_text())
          assert x['schema']=='marcat-treasury-auction-dates-v1'
          assert x['classification']=='private_retrospective_auction_dates_only'
          assert x['collected_year']==year
          assert x['event_count']>0
          assert x['event_count']<=x['source_reported_records']
          assert x['first_publication_time_verified'] is False
          assert x['historical_asof_eligible'] is False
          assert x['model_forecast_modified'] is False
          assert x['public_records_modified'] is False
          assert all(e['auction_date_et'].startswith(str(year)+'-')
                     and e['first_publication_timestamp_verified'] is False
                     and e['provider_first_vintage_verified'] is False
                     and e['forecast_signal_approved'] is False
                     and e['backtest_asof_eligible'] is False
                     and e['announcement_date_et']<=e['auction_date_et']<=e['issue_date_et']
                     for e in x['events'])
          print('TREASURY_YEAR_VALIDATED',year,x['event_count'],x['source_pages'])
          PY
            if ! python engine/scripts/push_newsroom_snapshot.py --kind treasury-auctions --input "${target}"; then
              echo "::warning::TREASURY_YEAR_ARCHIVE_FAILED ${year}"
              failed_years="${failed_years} ${year}"
              rm -f "${target}"
              continue
            fi
            successful_years=$((successful_years + 1))
            rm -f "${target}"
            sleep 2
          done
          echo "TREASURY_HISTORY_1996_2014_SUCCESS_COUNT=${successful_years}"
          if [[ -n "${failed_years}" ]]; then
            echo "::error::TREASURY_HISTORY_1996_2014_FAILED_YEARS=${failed_years}"
            exit 1
          fi
          test "${successful_years}" -eq 19
      - name: Ensure provider data is never in public workspace
        if: always()
        run: |
          test ! -e treasury-provider-data.json
          rm -f "$RUNNER_TEMP"/treasury-20??-private.json
