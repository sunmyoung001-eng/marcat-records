name: marCat Cboe Official Weeklys CSV Freshness Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cboe-weeklys-source-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-cboe-primary-date-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Verify official Cboe CSV dated refresh and instrument families (no raw publish)
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,io,json,re,sys
          from datetime import datetime,timezone
          from urllib.parse import urlparse
          import requests
          url='https://www.cboe.com/available_weeklys/get_csv_download/'
          try:
              response=requests.get(url,timeout=(5,24),headers={
                  'Accept':'text/csv,application/octet-stream,*/*',
                  'User-Agent':'marCatResearch/0.1 (+https://github.com/sunmyoung001-eng/marcat)'})
              response.raise_for_status()
          except requests.RequestException as exc:
              print('CBOE_SOURCE_HTTP_BLOCKED',type(exc).__name__,str(exc)[:150])
              raise SystemExit(10)
          host=urlparse(response.url).hostname
          if not host or (host!='cboe.com' and not host.endswith('.cboe.com')):
              raise SystemExit('CBOE_UNAPPROVED_REDIRECT')
          raw=response.content
          if not isinstance(raw,bytes) or not 400<len(raw)<4_000_000:
              raise SystemExit('CBOE_CSV_SIZE_INVALID')
          try:
              content=raw.decode('utf-8-sig')
          except UnicodeError:
              raise SystemExit('CBOE_CSV_DECODING_INVALID')
          rows=list(csv.reader(io.StringIO(content)))
          header=' '.join(content.splitlines()[:18])
          m=re.search(r'(?i)(?:as\s+of|effective\s+date)\s*:?\s*(\d{1,2}/\d{1,2}/\d{2,4})',header)
          if not m:
              print('CBOE_HOLD_NO_VERIFIABLE_ASOF_DATE',len(rows))
              raise SystemExit(12)
          stamp=m.group(1)
          for pattern in ('%m/%d/%Y','%m/%d/%y'):
              try:
                  day=datetime.strptime(stamp,pattern).date()
                  break
              except ValueError:
                  pass
          else:
              raise SystemExit('CBOE_UNPARSABLE_ASOF_DATE')
          age=(datetime.now(timezone.utc).date()-day).days
          fields=content.upper()
          observed={v:(v in fields) for v in ('SPXW','XSP','VIX')}
          print(json.dumps({'source':'Cboe official CSV','asof_date':day.isoformat(),
              'age_days':age,'csv_rows':len(rows),'source_sha256':hashlib.sha256(raw).hexdigest(),
              'product_markers':observed,'first_public_vintage_verified':False,
              'forecast_signal_approved':False},sort_keys=True))
          if not -1<=age<=14:
              raise SystemExit('CBOE_HOLD_STALE_CSV')
          if not any(observed.values()):
              raise SystemExit('CBOE_HOLD_NO_DERIVATIVE_MARKERS')
          print('CBOE_CURRENT_SOURCE_CONTENT_VALIDATED_RESEARCH_ONLY')
          PY
