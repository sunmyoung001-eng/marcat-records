name: marCat ALFRED ICSA As-of Day Research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alfred-asof-study.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marcat-alfred-asof-research
  cancel-in-progress: false
jobs:
  audit-fred-asof-vintages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private ALFRED source reader
        uses: actions/checkout@v4
        with:
          repository: sunmyoung001-eng/marcat
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FRED HTTP adapter
        run: python -m pip install requests
      - name: Fetch two historical ALFRED as-of days into private runner temporary file
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: engine
        run: python engine/scripts/probe_alfred_asof.py --output "$RUNNER_TEMP/alfred-asof-private.json"
      - name: Validate read-only result and no first release claims
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'alfred-asof-private.json'
          j=json.loads(f.read_text())
          assert j['schema']=='marcat-alfred-asof-research-v1'
          assert j['classification']=='private_alfred_historical_day_research_only'
          assert j['series']=='ICSA'
          assert j['asof_dates']==['2026-10-29','2026-11-05']
          assert j['common_observations']>=1
          assert 0<=j['revised_common_observations']<=j['common_observations']
          assert j['first_release_time_verified'] is False
          assert j['historical_subscriber_capture_verified'] is False
          assert j['market_consensus_connected'] is False
          assert j['forecast_eligible'] is False
          assert j['official_prediction_generated'] is False
          assert j['public_records_modified'] is False
          print('ALFRED_PRIVATE_DAY_VINTAGE_READBACK_OK')
          PY
      - name: Preserve research observations in immutable private repository
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --kind alfred-asof --input "$RUNNER_TEMP/alfred-asof-private.json"
      - name: Delete provider temporary data; no public archive
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/alfred-asof-private.json"
          test ! -e alfred-provider-values.json
