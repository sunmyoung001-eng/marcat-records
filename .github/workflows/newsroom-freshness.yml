name: marCat Newsroom Schedule Watchdog
on:
  schedule:
    - cron: '41 15 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/newsroom-freshness.yml'
      - 'ops/check_newsroom_runs.py'
      - 'ops/test_check_newsroom_runs.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom-freshness.yml'
      - 'ops/check_newsroom_runs.py'
      - 'ops/test_check_newsroom_runs.py'
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check missing, delayed and recovered run cases
        run: python3 -m unittest discover -s ops -p 'test_check_newsroom_runs.py'
      - name: Check the latest due newsroom slot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%F)
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/newsroom-archive.yml/runs" \
            -f branch=main -f event=schedule -f "created=>=$since" -F per_page=100 \
            | python3 ops/check_newsroom_runs.py
