name: marCat Private Newsroom Snapshot
on:
  schedule:
    # Weekday observation after JPX and after the US pre-open window.
    - cron: '29 14 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marcat-private-newsroom-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Record actual observation trigger
        env:
          OBSERVATION_EVENT: ${{ github.event_name }}
          OBSERVATION_ACTOR: ${{ github.actor }}
          OBSERVATION_CRON: ${{ github.event.schedule }}
        run: |
          printf 'event=%s actor=%s cron=%s run=%s attempt=%s\n' "$OBSERVATION_EVENT" "$OBSERVATION_ACTOR" "$OBSERVATION_CRON" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Checkout private marCat code only
        uses: actions/checkout@v4
        with:
          repository: sunmyoung001-eng/marcat
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only provider clients
        run: python -m pip install numpy pandas requests
      - name: Fetch, validate and build private observation reports
        working-directory: engine
        env:
          PYTHONPATH: .
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/archive_newsroom_snapshot.py --output "${RUNNER_TEMP}/newsroom-snapshot.json"
      - name: Create-only archive in private marCat repository
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --input "${RUNNER_TEMP}/newsroom-snapshot.json"
      - name: Verify private archived bytes and build MasterCat inbox
        working-directory: engine
        env:
          PYTHONPATH: .
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python scripts/prepare_mastercat_inbox.py --snapshot "${RUNNER_TEMP}/newsroom-snapshot.json" --output "${RUNNER_TEMP}/mastercat-inbox.json"
      - name: Append observation-only inbox to private branch
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --kind mastercat-inbox --input "${RUNNER_TEMP}/mastercat-inbox.json"
      - name: Generate deterministic private rule briefing
        working-directory: engine
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_rule_briefing.py \
            --archived-source "${RUNNER_TEMP}/newsroom-snapshot.json" \
            --inbox "${RUNNER_TEMP}/mastercat-inbox.json" \
            --output "${RUNNER_TEMP}/rule-briefing.json"
      - name: Append rule briefing to the private archive and verify bytes
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --kind rule-briefing --input "${RUNNER_TEMP}/rule-briefing.json"
      - name: Consume date-only CalendarCat report in MasterCat
        working-directory: engine
        env:
          PYTHONPATH: .
        run: |
          python scripts/consume_calendar_report.py \
            --source "${RUNNER_TEMP}/newsroom-snapshot.json" \
            --inbox "${RUNNER_TEMP}/mastercat-inbox.json" \
            --briefing "${RUNNER_TEMP}/rule-briefing.json" \
            --output "${RUNNER_TEMP}/mastercat-calendar-consumption.json"
      - name: Archive MasterCat calendar consumption and verify private bytes
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --kind mastercat-calendar-consumption --input "${RUNNER_TEMP}/mastercat-calendar-consumption.json"
      - name: Consume official news and six numerical reports with gate diagnostics
        working-directory: engine
        env:
          PYTHONPATH: .
        run: |
          python scripts/consume_department_reports.py \
            --source "${RUNNER_TEMP}/newsroom-snapshot.json" \
            --inbox "${RUNNER_TEMP}/mastercat-inbox.json" \
            --briefing "${RUNNER_TEMP}/rule-briefing.json" \
            --output "${RUNNER_TEMP}/mastercat-department-consumption.json"
      - name: Archive private department diagnosis and verify bytes
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python engine/scripts/push_newsroom_snapshot.py --kind mastercat-department-consumption --input "${RUNNER_TEMP}/mastercat-department-consumption.json"
      - name: Erase ephemeral observations
        if: always()
        run: rm -f "${RUNNER_TEMP}/newsroom-snapshot.json" "${RUNNER_TEMP}/mastercat-inbox.json" "${RUNNER_TEMP}/rule-briefing.json" "${RUNNER_TEMP}/mastercat-calendar-consumption.json" "${RUNNER_TEMP}/mastercat-department-consumption.json"
