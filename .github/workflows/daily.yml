name: daily-forecast
on:
  # MARCAT-054 Phase 8: publication cron intentionally disabled until every
  # SuperCat passes the 48/48 operational gate and a separate release approval.
  # This old forecast implementation remains versioned below but is hard-disabled.
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml', 'ops/forecast-release-gate.json']
  workflow_dispatch:
    inputs:
      force:
        description: "Run outside the publish window (test only)"
        type: boolean
        default: false
concurrency:
  group: daily-forecast
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  forecast_lock_verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Phase 8 default-deny release lock
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("ops/forecast-release-gate.json").read_text())
          assert x["schema"]=="marcat-supercat-forecast-release-gate-v1"
          assert x["state"]=="locked"
          assert x["approved"] is False
          assert x["verified_gate_count"] < x["required_gate_count"] == 48
          print("FORECAST_LOCKED: no regular or manual publication")
          PY
  publish:
    # Hard-stop independently of JSON or secrets. No schedule trigger and
    # no workflow_dispatch/Worker call can run the old publisher.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Window guard
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          H=$((10#$(TZ=America/New_York date +%H%M))); D=$(TZ=America/New_York date +%u)
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; echo "arg=--force" >> "$GITHUB_OUTPUT"
          elif [ "$D" -le 5 ] && [ "$H" -ge 800 ] && [ "$H" -lt 915 ]; then echo "run=1" >> "$GITHUB_OUTPUT"; echo "arg=" >> "$GITHUB_OUTPUT"
          else echo "run=0" >> "$GITHUB_OUTPUT"; echo "outside publish window (ET $H, weekday $D): nothing to do"; fi
      - name: Fail missed scheduled publish window (never backdate forecast)
        if: github.event_name == 'schedule' && steps.guard.outputs.run != '1'
        run: |
          echo '::error::Scheduled run missed the safe 08:00-09:15 America/New_York publish window. No forecast was issued.'
          exit 1
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == '1'
        with: { path: public }
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == '1'
        with:
          repository: sunmyoung001-eng/marcat
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with: { python-version: "3.12" }
      - name: Install
        if: steps.guard.outputs.run == '1'
        run: pip install --quiet numpy pandas requests
      - name: Run engine
        if: steps.guard.outputs.run == '1'
        working-directory: engine
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          PUBLIC_DIR: ${{ github.workspace }}/public/records
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TEST_RUN_ID: manual-${{ github.run_id }}
        run: python scripts/run_daily.py ${{ steps.guard.outputs.arg }}
      - name: Save engine state (private repo) then publish record (this repo)
        if: steps.guard.outputs.run == '1'
        run: |
          set -euo pipefail
          git config --global user.name marcat-bot
          git config --global user.email bot@users.noreply.github.com
          (
            cd engine
            git add data records
            if git diff --cached --quiet; then
              echo "engine: no staged state changes"
            else
              git commit -q -m "state $(date -u +%F)"
              git push -q
            fi
          )
          (
            cd public
            git add records
            if git diff --cached --quiet; then
              echo "public: no staged forecast changes"
            else
              git commit -q -m "forecast $(TZ=America/New_York date +%F)"
              git push -q
            fi
          )
